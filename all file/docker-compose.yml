services:
  # ── MongoDB ────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: smartinvoice-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartinvoice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── Flask Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartinvoice-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - DB_NAME=invoice_ai
      - JWT_SECRET=invoice_secret_2026
      - PORT=5000
      - FLASK_DEBUG=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=claude-sonnet-4-20250514
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:7b-instruct-q3_K_M
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ORIGINS=*
      - APP_URL=http://localhost:3000
      - MAGICBELL_API_KEY=${MAGICBELL_API_KEY:-}
      - MAGICBELL_API_SECRET=${MAGICBELL_API_SECRET:-}
      - SMTP_EMAIL=${SMTP_EMAIL:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongo
      - redis

  # ── Celery Worker ──────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartinvoice-celery
    restart: unless-stopped
    command: celery -A services.celery_worker.celery worker --loglevel=info --concurrency=2
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - DB_NAME=invoice_ai
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=claude-sonnet-4-20250514
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:7b-instruct-q3_K_M
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongo
      - redis

  # ── Next.js Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./Front-end/pfe-project
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://192.168.147.74:5000
    container_name: smartinvoice-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
